[project]
name = "ab-monitor"
version = "0.1.0"
description = "Tensorlake monitor for PostHog-backed A/B test opportunity detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.36.0",
    "posthog>=7.14.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
tensorlake = ["tensorlake"]

[project.scripts]
ab-monitor = "ab_monitor.cli:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ab_monitor"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
